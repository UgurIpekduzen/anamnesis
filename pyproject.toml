[project]
name = "anamnesis"
version = "0.1.0"
description = "Personal Project Context Engine"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-firestore",
    "google-cloud-pubsub",
    "google-adk",
    "python-dotenv",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "google-auth",
    "cryptography",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# An application, not a library: only the dependencies get installed.
package = false

[tool.pytest.ini_options]
# Tests import `src...`, `api...` and `agent...` from the repo root.
pythonpath = ["."]
