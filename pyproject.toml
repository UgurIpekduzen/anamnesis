[project]
name = "anamnesis"
version = "0.1.0"
description = "Personal Project Context Engine"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-firestore",
    "google-cloud-pubsub",
    "google-adk",
    "python-dotenv",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "google-auth",
    "cryptography",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# An application, not a library: only the dependencies get installed.
package = false

[tool.pytest.ini_options]
# Tests import `src...`, `api...` and `agent...` from the repo root.
pythonpath = ["."]

[tool.ruff]
# Not PEP 8's 79 — that's narrower than this codebase's descriptive names
# and f-strings comfortably fit, and 100 is what `ruff format` was run
# with repo-wide. Kept as project config so future runs use the same width.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
