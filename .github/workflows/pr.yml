name: Terraform PR Check

on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write
  # Required for Workload Identity Federation — no service account key
  # is stored anywhere, GitHub issues a short-lived OIDC token instead.
  id-token: write

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      # variables.tf has no defaults for these (portability — see
      # terraform.tfvars.example) — locally they come from
      # terraform.tfvars, which is gitignored and never reaches CI.
      # Without these, `terraform plan` blocks waiting for interactive
      # input that a runner can never provide.
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
      TF_VAR_google_oauth_client_id: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      # A plan only reads, so it runs as the read-only account instead of
      # the one that can change the project.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT_EMAIL }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v8
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}${{ steps.plan.outputs.stderr }}"
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${process.env.PLAN}
            \`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
