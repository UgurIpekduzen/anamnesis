name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/anamnesis/streamlit-app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Firestore and Pub/Sub emulators
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 gcr.io/google.com/cloudsdktool/cloud-sdk:emulators gcloud emulators firestore start --host-port=0.0.0.0:8080
          docker run -d --name pubsub-emulator -p 8085:8085 gcr.io/google.com/cloudsdktool/cloud-sdk:emulators gcloud beta emulators pubsub start --project=anamnesis-local --host-port=0.0.0.0:8085

      - name: Wait for emulators to be ready
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/8080) 2>/dev/null && break; sleep 1; done
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/8085) 2>/dev/null && break; sleep 1; done

      - name: Run tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          PUBSUB_EMULATOR_HOST: localhost:8085
          GCP_PROJECT_ID: anamnesis-local
        run: pytest test/ -v

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t ${{ env.IMAGE }} .

      - name: Push image
        run: docker push ${{ env.IMAGE }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_jira_base_url: ${{ vars.JIRA_BASE_URL }}
          TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
          TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve
