name: Deploy

on:
  push:
    branches:
      - main

# Read-only by default; only the deploy job below is granted id-token, the
# right to mint a Google credential (APPCE-100).
permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/anamnesis/app:${{ github.sha }}

jobs:
  # Runs third-party code (every locked dependency) and holds no cloud
  # credentials: without id-token permission it cannot ask GitHub for an
  # OIDC token, so a compromised package can't reach GCP from here.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # uv installs from uv.lock exactly (--frozen), so a merge never deploys
      # whatever happens to be the newest release that day (APPCE-96).
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.30"
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start Firestore and Pub/Sub emulators
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 gcr.io/google.com/cloudsdktool/cloud-sdk:emulators gcloud emulators firestore start --host-port=0.0.0.0:8080
          docker run -d --name pubsub-emulator -p 8085:8085 gcr.io/google.com/cloudsdktool/cloud-sdk:emulators gcloud beta emulators pubsub start --project=anamnesis-local --host-port=0.0.0.0:8085

      - name: Wait for emulators to be ready
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/8080) 2>/dev/null && break; sleep 1; done
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/8085) 2>/dev/null && break; sleep 1; done

      - name: Run tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          PUBSUB_EMULATOR_HOST: localhost:8085
          GCP_PROJECT_ID: anamnesis-local
        run: uv run --frozen pytest test/ -v

  # Only reached once every test passed, and the only job that can
  # authenticate to GCP.
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -f Dockerfile.app -t ${{ env.IMAGE }} .

      - name: Push image
        run: docker push ${{ env.IMAGE }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
          TF_VAR_google_oauth_client_id: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve
