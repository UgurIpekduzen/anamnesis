version: '3'

tasks:
  tf:init:
    cmds:
      - docker compose run --rm terraform init

  tf:fmt:
    cmds:
      - docker compose run --rm terraform fmt -check

  tf:fmt:fix:
    desc: Auto-format .tf/.tfvars files (fixes what tf:fmt only reports)
    cmds:
      - docker compose run --rm terraform fmt

  tf:validate:
    cmds:
      - docker compose run --rm terraform validate

  tf:plan:
    cmds:
      - docker compose run --rm terraform plan

  tf:apply:
    desc: Apply Terraform without asking for confirmation, defaulting image_tag to whatever is currently deployed (unless TF_VAR_image_tag is already set) — run task tf:plan first
    cmds:
      - |
        CURRENT_TAG=$(docker compose run --rm gcloud run services describe anamnesis-app --region=us-central1 --format="value(spec.template.spec.containers[0].image)" 2>/dev/null | sed 's/.*://')
        # docker compose run does NOT forward the invoking shell's env
        # vars into the container by default — -e <NAME> (no value) is
        # what actually pulls it from the host, this was silently
        # missing before and TF_VAR_* overrides never reached terraform.
        # Nobody reviews the plan at a prompt anymore, so an unreadable tag
        # must stop the run: falling through would apply the default
        # ("latest") and quietly repoint both services at it.
        if [ -n "$CURRENT_TAG" ] || [ -n "$TF_VAR_image_tag" ]; then
          TF_VAR_image_tag="${TF_VAR_image_tag:-$CURRENT_TAG}" docker compose run --rm -e TF_VAR_image_tag terraform apply -auto-approve
        else
          echo "Couldn't read the deployed image tag; set TF_VAR_image_tag and retry." >&2
          exit 1
        fi

  tf:check:
    desc: Run init, auto-fix formatting, validate, and plan in sequence
    cmds:
      - task: tf:init
      - task: tf:fmt:fix
      - task: tf:validate
      - task: tf:plan

  uv:lock:
    desc: Re-resolve pyproject.toml into uv.lock without upgrading anything already locked (uv runs in Docker, APPCE-96)
    cmds:
      - docker compose run --rm uv lock

  uv:upgrade:
    desc: Deliberately upgrade every dependency to its newest allowed version and rewrite uv.lock — review the diff, run the tests and task eval:injection before committing
    cmds:
      - docker compose run --rm uv lock --upgrade

  uv:add:
    desc: Add a dependency and update uv.lock — task uv:add -- <package> (add --dev for test-only ones)
    cmds:
      - docker compose run --rm uv add {{.CLI_ARGS}}

  uv:test:
    desc: Run the unit tests in the locked, isolated environment (no emulators or credentials — exactly what CI's unit stage sees)
    cmds:
      - docker compose run --rm uv run pytest test/ --ignore=test/integration {{.CLI_ARGS}}

  emulators:up:
    desc: Start the Firestore and Pub/Sub emulators in the background
    cmds:
      - docker compose up -d firestore-emulator pubsub-emulator

  emulators:down:
    desc: Stop the Firestore and Pub/Sub emulators
    cmds:
      - docker compose down firestore-emulator pubsub-emulator

  subscriber:up:
    desc: Run the dev subscriber (against the dockerized emulators) in the background
    cmds:
      - docker compose up -d subscriber

  subscriber:logs:
    desc: Tail logs from the dev subscriber
    cmds:
      - docker compose logs -f subscriber

  subscriber:down:
    desc: Stop the dev subscriber
    cmds:
      - docker compose down subscriber

  api:up:
    desc: Run the FastAPI backend in the background (APPCE-53)
    cmds:
      # The API's code is baked into its image (no bind mount), so without
      # --build a restart quietly keeps running the previous code. Docker's
      # layer cache makes this fast when nothing changed.
      - docker compose up -d --build api

  api:logs:
    desc: Tail logs from the FastAPI backend
    cmds:
      - docker compose logs -f api

  api:down:
    desc: Stop the FastAPI backend
    cmds:
      - docker compose down api

  frontend:up:
    desc: Run the React dev server in the background (APPCE-52)
    cmds:
      - docker compose up -d frontend

  frontend:logs:
    desc: Tail logs from the React dev server
    cmds:
      - docker compose logs -f frontend

  frontend:down:
    desc: Stop the React dev server
    cmds:
      - docker compose down frontend

  adk:up:
    desc: Run adk web (against the dockerized emulators) in the background
    cmds:
      - docker compose up -d adk-web

  adk:logs:
    desc: Tail logs from adk web
    cmds:
      - docker compose logs -f adk-web

  adk:down:
    desc: Stop adk web
    cmds:
      - docker compose down adk-web

  eval:injection:
    desc: Prompt-injection eval against the real model (costs tokens; not part of pytest) — task eval:injection -- --runs 3
    cmds:
      # eval/ isn't baked into the api image, so it's mounted; the api
      # service already carries the real-GCP (Vertex AI) credentials.
      - docker compose run --rm -v "$PWD/eval:/app/eval" api python -m eval.prompt_injection {{.CLI_ARGS}}

  gcloud:
    desc: Run an arbitrary gcloud command via the dockerized CLI (task gcloud -- <args>)
    cmds:
      - docker compose run --rm gcloud {{.CLI_ARGS}}

  gcloud:run:services:list:
    desc: List Cloud Run services (task gcloud:run:services:list -- --region=us-central1)
    cmds:
      - docker compose run --rm gcloud run services list {{.CLI_ARGS}}

  gcloud:run:services:delete:
    desc: Delete a Cloud Run service (task gcloud:run:services:delete -- anamnesis-subscriber --region=us-central1)
    cmds:
      - docker compose run --rm gcloud run services delete {{.CLI_ARGS}}

  gcloud:run:logs:
    desc: Read recent logs for a Cloud Run service (task gcloud:run:logs -- anamnesis-subscriber)
    cmds:
      - >-
        docker compose run --rm gcloud logging read
        'resource.type="cloud_run_revision" AND resource.labels.service_name="{{.CLI_ARGS}}"'
        --limit=30 --format="value(timestamp,severity,textPayload)" --freshness=1d

  gcloud:pubsub:pull:
    desc: Pull messages from a subscription without acking (task gcloud:pubsub:pull -- fact-events-dlq-sub)
    cmds:
      - docker compose run --rm gcloud pubsub subscriptions pull {{.CLI_ARGS}} --limit=10

  secrets:github-key:pull:
    desc: Print the current GitHub token encryption key, for pasting into your local .env (see .env.example)
    cmds:
      - docker compose run --rm gcloud secrets versions access latest --secret=github-token-encryption-key

  secrets:github-key:rotate:
    desc: Start a key rotation (APPCE-103) — put a new key in front of the current one, so new tokens use it and old ones stay readable. Then run, in order, reload, reencrypt and retire. SECRET=<name> targets another secret, for a rehearsal only.
    vars:
      SECRET: '{{.SECRET | default "github-token-encryption-key"}}'
    cmds:
      - |
        # The app must already be running code that can read a list of keys
        # (APPCE-103): an older one reads "new,old" as a single, invalid key
        # and fails on the first token. Refuse to start unless the deployed
        # image was built from a commit that contains that change.
        DEPLOYED=$(docker compose run --rm -T gcloud run services describe anamnesis-app --region=us-central1 --format="value(spec.template.spec.containers[0].image)" | tr -d '\r\n' | sed 's/.*://')
        if [ "{{.SECRET}}" = "github-token-encryption-key" ] && ! git merge-base --is-ancestor d628757 "$DEPLOYED" 2>/dev/null; then
          echo "The deployed app ($DEPLOYED) predates multi-key support. Deploy a version that includes commit d628757 first." >&2
          exit 1
        fi
        CURRENT=$(docker compose run --rm -T gcloud secrets versions access latest --secret={{.SECRET}} | tr -d '\r\n')
        case "$CURRENT" in
          "") echo "Couldn't read the current key." >&2; exit 1 ;;
          *,*) echo "A rotation is already in progress (two keys are stored). Finish it first: reencrypt, then retire." >&2; exit 1 ;;
        esac
        NEW=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
        printf '%s,%s' "$NEW" "$CURRENT" | docker compose run --rm -T gcloud secrets versions add {{.SECRET}} --data-file=-

  secrets:github-key:reload:
    desc: Start a new revision of anamnesis-app so it re-reads the key (a secret marked "latest" is only resolved when a revision starts). Adds a label, so the next Terraform plan will show it as drift.
    cmds:
      - docker compose run --rm gcloud run services update anamnesis-app --region=us-central1 --update-labels=key-rotated=$(date +%s)

  secrets:github-key:reencrypt:
    desc: Re-encrypt every stored GitHub/Jira token with the newest key (safe to re-run; reports tokens no key can read)
    cmds:
      - docker compose build api
      - |
        KEYS=$(docker compose run --rm -T gcloud secrets versions access latest --secret=github-token-encryption-key | tr -d '\r\n')
        docker compose run --rm -e GITHUB_TOKEN_ENCRYPTION_KEY="$KEYS" api python -m src.key_rotation reencrypt

  secrets:github-key:retire:
    desc: Finish a rotation — keep only the newest key and disable the older secret versions. Refuses if any stored token still needs an older key (run reencrypt first). SECRET=<name> targets another secret, for a rehearsal only.
    vars:
      SECRET: '{{.SECRET | default "github-token-encryption-key"}}'
    cmds:
      - |
        KEYS=$(docker compose run --rm -T gcloud secrets versions access latest --secret={{.SECRET}} | tr -d '\r\n')
        case "$KEYS" in
          *,*) ;;
          *) echo "Only one key is stored — nothing to retire."; exit 0 ;;
        esac
        PRIMARY=${KEYS%%,*}
        docker compose build api
        docker compose run --rm -e GITHUB_TOKEN_ENCRYPTION_KEY="$PRIMARY" api python -m src.key_rotation check \
          || { echo "Some tokens still need an older key — run reencrypt first. Nothing was changed." >&2; exit 1; }
        printf '%s' "$PRIMARY" | docker compose run --rm -T gcloud secrets versions add {{.SECRET}} --data-file=-
        # Versions list newest first: skip the one just added, disable the rest.
        for v in $(docker compose run --rm -T gcloud secrets versions list {{.SECRET}} --filter="state=ENABLED" --format="value(name)" | tr -d '\r' | tail -n +2); do
          docker compose run --rm -T gcloud secrets versions disable "$v" --secret={{.SECRET}}
        done
        echo "Done. Run task secrets:github-key:reload so the app loads the single key."

  secrets:github-key:init:
    desc: One-time setup — generate a Fernet key and store it as the GitHub token encryption secret. Safe to re-run; skips if a version already exists (overwriting it would break already-encrypted tokens).
    cmds:
      - |
        if docker compose run --rm gcloud secrets versions list github-token-encryption-key --format="value(name)" 2>/dev/null | grep -q .; then
          echo "A key already exists for github-token-encryption-key — leaving it as is."
        else
          python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" | docker compose run --rm -T gcloud secrets versions add github-token-encryption-key --data-file=-
        fi
