version: '3'

vars:
  # Spelled out once: another region, a renamed service or secret is one edit
  # here instead of a search through every task.
  REGION: us-central1
  APP_SERVICE: anamnesis-app
  SUBSCRIBER_SERVICE: anamnesis-subscriber
  KEY_SECRET: github-token-encryption-key

tasks:
  tf:init:
    cmds:
      - docker compose run --rm terraform init

  tf:fmt:
    cmds:
      - docker compose run --rm terraform fmt -check

  tf:fmt:fix:
    desc: Auto-format .tf/.tfvars files (fixes what tf:fmt only reports)
    cmds:
      - docker compose run --rm terraform fmt

  tf:validate:
    aliases: [tv]
    desc: Check that the Terraform files are syntactically valid (no plan, no GCP calls)
    cmds:
      - docker compose run --rm terraform validate

  tf:plan:
    aliases: [tp]
    cmds:
      - docker compose run --rm terraform plan

  tf:lint:
    desc: Lint the Terraform files (tflint) — naming, unused declarations, provider best practices that fmt/validate don't cover
    cmds:
      - docker compose run --rm tflint --init
      - docker compose run --rm tflint --recursive

  docker:lint:
    desc: Lint every Dockerfile (hadolint) — cache-busting, version pinning and other best practices `docker build` doesn't check
    cmds:
      - docker compose run --rm hadolint Dockerfile Dockerfile.app Dockerfile.gcloud frontend/Dockerfile

  yaml:lint:
    desc: Lint every YAML file (yamllint) — compose files, GitHub Actions workflows, dependabot.yml
    cmds:
      - docker compose run --rm yamllint .

  tf:apply:
    aliases: [ta]
    desc: Apply Terraform without asking for confirmation, defaulting image_tag to whatever is currently deployed (unless TF_VAR_image_tag is already set) — run task tf:plan first
    cmds:
      - |
        CURRENT_TAG=$(docker compose run --rm gcloud run services describe {{.APP_SERVICE}} --region={{.REGION}} --format="value(spec.template.spec.containers[0].image)" 2>/dev/null | sed 's/.*://')
        # docker compose run does NOT forward the invoking shell's env
        # vars into the container by default — -e <NAME> (no value) is
        # what actually pulls it from the host, this was silently
        # missing before and TF_VAR_* overrides never reached terraform.
        # Nobody reviews the plan at a prompt anymore, so an unreadable tag
        # must stop the run: falling through would apply the default
        # ("latest") and quietly repoint both services at it.
        if [ -n "$CURRENT_TAG" ] || [ -n "$TF_VAR_image_tag" ]; then
          TF_VAR_image_tag="${TF_VAR_image_tag:-$CURRENT_TAG}" docker compose run --rm -e TF_VAR_image_tag terraform apply -auto-approve
        else
          echo "Couldn't read the deployed image tag; set TF_VAR_image_tag and retry." >&2
          exit 1
        fi

  deploy:status:
    desc: Show the latest Deploy workflow run, what is running on Cloud Run against origin/main, and whether the app is healthy
    cmds:
      - |
        echo "== Latest Deploy run =="
        gh run list -w Deploy -L 1
        echo
        echo "== origin/main =="
        git fetch -q origin && git rev-parse origin/main
        echo
        echo "== Cloud Run =="
        for s in {{.APP_SERVICE}} {{.SUBSCRIBER_SERVICE}}; do
          docker compose run --rm -T gcloud run services describe $s --region={{.REGION}} --format="value(metadata.name,spec.template.spec.containers[0].image,status.latestReadyRevisionName)" | tr -d '\r'
        done
        URL=$(docker compose run --rm -T gcloud run services describe {{.APP_SERVICE}} --region={{.REGION}} --format="value(status.url)" | tr -d '\r\n')
        curl -s -o /dev/null -w "health: %{http_code}\n" "$URL/health"

  tf:check:
    aliases: [tf]
    desc: Run init, auto-fix formatting, validate, and plan in sequence
    cmds:
      - task: tf:init
      - task: tf:fmt:fix
      - task: tf:validate
      - task: tf:plan

  alert:test:
    aliases: [at]
    desc: Write a fake ERROR log line so an alert policy fires and mails the owner — task alert:test [EVENT=agent_call_failed|github_poll]
    vars:
      EVENT: '{{.EVENT | default "agent_call_failed"}}'
    requires:
      vars:
        - name: EVENT
          enum: [agent_call_failed, github_poll]
    cmds:
      - >-
        docker compose run --rm -T gcloud logging write anamnesis-alert-test
        '{"event":"{{.EVENT}}","note":"alert test, ignore"}'
        --payload-type=json --severity=ERROR
        --monitored-resource-type=cloud_run_revision
        --monitored-resource-labels=service_name={{.APP_SERVICE}},location={{.REGION}},revision_name=test,configuration_name=test
      - |
        echo "Wrote a fake {{.EVENT}} error at $(date -u +%H:%M:%S) UTC."
        echo "The policy 'Anamnesis: {{.EVENT}}' should open within a minute and mail the owner shortly after."
        echo "No mail? A policy mails at most once an hour and stays open for 30 minutes after the last matching line."

  uv:lock:
    desc: Re-resolve pyproject.toml into uv.lock without upgrading anything already locked (uv runs in Docker)
    cmds:
      - docker compose run --rm uv lock

  uv:upgrade:
    desc: Deliberately upgrade every dependency to its newest allowed version and rewrite uv.lock — review the diff, run the tests and task eval:injection before committing
    cmds:
      - docker compose run --rm uv lock --upgrade

  test:integration:
    desc: Run the integration tests against the Firestore and Pub/Sub emulators (starts them if needed) — task test:integration -- <pytest args>
    deps: [emulators:up]
    cmds:
      - docker compose run --rm -e FIRESTORE_EMULATOR_HOST=firestore-emulator:8080 -e PUBSUB_EMULATOR_HOST=pubsub-emulator:8085 -e GCP_PROJECT_ID=anamnesis-local uv run pytest test/integration {{.CLI_ARGS}}

  test:all:
    desc: Run the unit tests, then the integration tests — the same tests CI runs
    cmds:
      - task: uv:test
      - task: test:integration

  uv:add:
    desc: Add a dependency and update uv.lock — task uv:add -- <package> (add --dev for test-only ones)
    cmds:
      - docker compose run --rm uv add {{.CLI_ARGS}}

  uv:test:
    aliases: [test, t]
    desc: Run the unit tests in the locked, isolated environment (no emulators or credentials — exactly what CI's unit stage sees)
    cmds:
      - docker compose run --rm uv run pytest test/ --ignore=test/integration {{.CLI_ARGS}}

  emulators:up:
    desc: Start the Firestore and Pub/Sub emulators in the background
    cmds:
      - docker compose up -d firestore-emulator pubsub-emulator

  emulators:down:
    desc: Stop the Firestore and Pub/Sub emulators
    cmds:
      - docker compose down firestore-emulator pubsub-emulator

  local:up:
    desc: Run the app on the emulators, not real GCP — then load a copy of the data with task db:load -- backups/<file>.json
    cmds:
      - docker compose up -d firestore-emulator pubsub-emulator
      - until curl -s -o /dev/null localhost:8085 && curl -s -o /dev/null localhost:8080; do sleep 1; done
      # The emulator subscription pushes to the dev subscriber, like Cloud Pub/Sub does in production.
      - docker compose run --rm -e PUBSUB_EMULATOR_HOST=pubsub-emulator:8085 -e GCP_PROJECT_ID=anamnesis-local -e PUSH_ENDPOINT=http://subscriber:8080 uv run python -m src.tools.setup_pubsub
      - docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build api subscriber
      - 'echo "Running on the emulators. They start empty: task db:load -- backups/<file>.json (again after every restart of the emulator)."'

  local:down:
    desc: Back to real GCP — stop the emulators and the dev subscriber, restart the API against the real database
    cmds:
      - docker compose stop subscriber firestore-emulator pubsub-emulator
      - docker compose up -d --build api

  db:dump:
    desc: Back up the REAL Firestore database to backups/firestore-<time>.json (read-only; the file holds real data and is git-ignored)
    cmds:
      - mkdir -p backups
      - docker compose build -q api
      - docker compose run --rm -v "$PWD/backups:/app/backups" api python -m src.tools.db_backup dump backups/firestore-$(date +%Y%m%d-%H%M%S).json

  db:load:
    desc: Load a dump into the Firestore EMULATOR (never the real database) — task db:load -- backups/<file>.json
    cmds:
      - docker compose up -d firestore-emulator
      - docker compose build -q api
      - docker compose run --rm -v "$PWD/backups:/app/backups" -e FIRESTORE_EMULATOR_HOST=firestore-emulator:8080 -e GCP_PROJECT_ID=anamnesis-local api python -m src.tools.db_backup load {{.CLI_ARGS}}

  db:verify:
    desc: Compare the EMULATOR's data with a dump, document by document (read-only) — task db:verify -- backups/<file>.json
    cmds:
      # A stopped emulator would be started empty and reported as "everything missing": refuse instead.
      - docker compose ps --status running -q firestore-emulator | grep -q . || { echo "The Firestore emulator isn't running (task local:up)."; exit 1; }
      - docker compose build -q api
      - docker compose run --rm -v "$PWD/backups:/app/backups" -e FIRESTORE_EMULATOR_HOST=firestore-emulator:8080 -e GCP_PROJECT_ID=anamnesis-local api python -m src.tools.db_backup verify {{.CLI_ARGS}}

  local:dump:
    desc: Save the EMULATOR's data to backups/local-<time>.json (it is lost when the emulator stops) — load it back with task db:load
    cmds:
      # A stopped emulator would be started empty and dumped as nothing: refuse instead.
      - docker compose ps --status running -q firestore-emulator | grep -q . || { echo "The Firestore emulator isn't running (task local:up)."; exit 1; }
      - mkdir -p backups
      - docker compose build -q api
      - docker compose run --rm -v "$PWD/backups:/app/backups" -e FIRESTORE_EMULATOR_HOST=firestore-emulator:8080 -e GCP_PROJECT_ID=anamnesis-local api python -m src.tools.db_backup dump backups/local-$(date +%Y%m%d-%H%M%S).json

  db:restore:
    desc: Show what writing a dump into the REAL database would change; write it only with -- backups/<file>.json --confirm-project <project id>
    cmds:
      - docker compose build -q api
      - docker compose run --rm -v "$PWD/backups:/app/backups" api python -m src.tools.db_backup restore {{.CLI_ARGS}}

  db:wipe:
    desc: Count what wiping the REAL database would delete; delete only with -- --confirm-project <project id>
    cmds:
      - docker compose build -q api
      - docker compose run --rm api python -m src.tools.db_backup wipe {{.CLI_ARGS}}

  subscriber:up:
    desc: Run the dev subscriber (against the dockerized emulators) in the background
    cmds:
      - docker compose up -d subscriber

  subscriber:logs:
    desc: Tail logs from the dev subscriber
    cmds:
      - docker compose logs -f subscriber

  subscriber:down:
    desc: Stop the dev subscriber
    cmds:
      - docker compose down subscriber

  api:up:
    aliases: [up]
    desc: Run the FastAPI backend in the background
    cmds:
      # The API's code is baked into its image (no bind mount), so without
      # --build a restart quietly keeps running the previous code. Docker's
      # layer cache makes this fast when nothing changed.
      - docker compose up -d --build api

  api:logs:
    desc: Tail logs from the FastAPI backend
    cmds:
      - docker compose logs -f api

  api:down:
    aliases: [down]
    desc: Stop the FastAPI backend
    cmds:
      - docker compose down api

  frontend:up:
    desc: Run the React dev server in the background
    cmds:
      - docker compose up -d frontend

  frontend:logs:
    desc: Tail logs from the React dev server
    cmds:
      - docker compose logs -f frontend

  frontend:check:
    desc: Type-check the frontend (needs the dev server container running — task frontend:up)
    cmds:
      - docker compose exec -T frontend npx tsc -b

  frontend:test:
    desc: Run the frontend test suite (Vitest) in a one-off container — task frontend:test -- <vitest args>
    cmds:
      - docker compose run --rm frontend npx vitest run {{.CLI_ARGS}}

  frontend:lint:
    desc: Lint the frontend (ESLint) in a one-off container — task frontend:lint -- --fix
    cmds:
      - docker compose run --rm frontend npx eslint . {{.CLI_ARGS}}

  frontend:format:
    desc: Reformat the frontend (Prettier) in a one-off container
    cmds:
      - docker compose run --rm frontend npx prettier --write .

  frontend:down:
    desc: Stop the React dev server
    cmds:
      - docker compose down frontend

  adk:up:
    desc: Run adk web (against the dockerized emulators) in the background
    cmds:
      - docker compose up -d adk-web

  adk:logs:
    desc: Tail logs from adk web
    cmds:
      - docker compose logs -f adk-web

  adk:down:
    desc: Stop adk web
    cmds:
      - docker compose down adk-web

  eval:injection:
    desc: Prompt-injection eval against the real model (costs tokens; not part of pytest) — task eval:injection -- --runs 3
    cmds:
      # eval/ isn't baked into the api image, so it's mounted; the api
      # service already carries the real-GCP (Vertex AI) credentials.
      - docker compose run --rm -v "$PWD/eval:/app/eval" api python -m eval.prompt_injection {{.CLI_ARGS}}

  eval:groundedness:
    desc: Groundedness eval against the real model — is what the agent says backed by its tools' data (costs tokens; not part of pytest) — task eval:groundedness -- --runs 5 [--only <text>]
    cmds:
      # The agent's code is baked into the api image, so build it first or the
      # eval measures whatever was built last (layer cache makes this quick).
      - docker compose build api
      - docker compose run --rm -v "$PWD/eval:/app/eval" api python -m eval.groundedness {{.CLI_ARGS}}

  gcloud:
    desc: Run an arbitrary gcloud command via the dockerized CLI (task gcloud -- <args>)
    cmds:
      - docker compose run --rm gcloud {{.CLI_ARGS}}

  gcloud:run:services:list:
    desc: List Cloud Run services (task gcloud:run:services:list -- --region=us-central1)
    cmds:
      - docker compose run --rm gcloud run services list {{.CLI_ARGS}}

  gcloud:run:services:delete:
    desc: Delete a Cloud Run service (task gcloud:run:services:delete -- anamnesis-subscriber --region=us-central1)
    cmds:
      - docker compose run --rm gcloud run services delete {{.CLI_ARGS}}

  gcloud:run:logs:
    desc: Read recent logs for a Cloud Run service (task gcloud:run:logs -- anamnesis-subscriber)
    cmds:
      - >-
        docker compose run --rm gcloud logging read
        'resource.type="cloud_run_revision" AND resource.labels.service_name="{{.CLI_ARGS}}"'
        --limit=30 --format="value(timestamp,severity,textPayload)" --freshness=1d

  gcloud:pubsub:pull:
    desc: Pull messages from a subscription without acking (task gcloud:pubsub:pull -- fact-events-dlq-sub)
    cmds:
      - docker compose run --rm gcloud pubsub subscriptions pull {{.CLI_ARGS}} --limit=10

  secrets:github-key:pull:
    desc: Print the current GitHub token encryption key, for pasting into your local .env (see .env.example)
    cmds:
      - docker compose run --rm gcloud secrets versions access latest --secret={{.KEY_SECRET}}

  secrets:github-key:rotate:
    desc: Start a key rotation — put a new key in front of the current one, so new tokens use it and old ones stay readable. Then run, in order, reload, reencrypt and retire. SECRET=<name> targets another secret, for a rehearsal only.
    vars:
      SECRET: '{{.SECRET | default .KEY_SECRET}}'
    cmds:
      - |
        # The app must already be running code that can read a list of keys
        # an older one reads "new,old" as a single, invalid key
        # and fails on the first token. Refuse to start unless the deployed
        # image was built from a commit that contains that change.
        DEPLOYED=$(docker compose run --rm -T gcloud run services describe {{.APP_SERVICE}} --region={{.REGION}} --format="value(spec.template.spec.containers[0].image)" | tr -d '\r\n' | sed 's/.*://')
        if [ "{{.SECRET}}" = "{{.KEY_SECRET}}" ] && ! git merge-base --is-ancestor d628757 "$DEPLOYED" 2>/dev/null; then
          echo "The deployed app ($DEPLOYED) predates multi-key support. Deploy a version that includes commit d628757 first." >&2
          exit 1
        fi
        CURRENT=$(docker compose run --rm -T gcloud secrets versions access latest --secret={{.SECRET}} | tr -d '\r\n')
        case "$CURRENT" in
          "") echo "Couldn't read the current key." >&2; exit 1 ;;
          *,*) echo "A rotation is already in progress (two keys are stored). Finish it first: reencrypt, then retire." >&2; exit 1 ;;
        esac
        NEW=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
        printf '%s,%s' "$NEW" "$CURRENT" | docker compose run --rm -T gcloud secrets versions add {{.SECRET}} --data-file=-

  secrets:github-key:reload:
    desc: Start a new revision of anamnesis-app so it re-reads the key (a secret marked "latest" is only resolved when a revision starts). Adds a label, so the next Terraform plan will show it as drift.
    cmds:
      - docker compose run --rm gcloud run services update {{.APP_SERVICE}} --region={{.REGION}} --update-labels=key-rotated=$(date +%s)

  secrets:github-key:reencrypt:
    desc: Re-encrypt every stored GitHub/Jira token with the newest key (safe to re-run; reports tokens no key can read)
    cmds:
      - docker compose build api
      - |
        KEYS=$(docker compose run --rm -T gcloud secrets versions access latest --secret={{.KEY_SECRET}} | tr -d '\r\n')
        docker compose run --rm -e GITHUB_TOKEN_ENCRYPTION_KEY="$KEYS" api python -m src.tools.key_rotation reencrypt

  secrets:github-key:retire:
    desc: Finish a rotation — keep only the newest key and disable the older secret versions. Refuses if any stored token still needs an older key (run reencrypt first). SECRET=<name> targets another secret, for a rehearsal only.
    vars:
      SECRET: '{{.SECRET | default .KEY_SECRET}}'
    cmds:
      - |
        KEYS=$(docker compose run --rm -T gcloud secrets versions access latest --secret={{.SECRET}} | tr -d '\r\n')
        case "$KEYS" in
          *,*) ;;
          *) echo "Only one key is stored — nothing to retire."; exit 0 ;;
        esac
        PRIMARY=${KEYS%%,*}
        docker compose build api
        docker compose run --rm -e GITHUB_TOKEN_ENCRYPTION_KEY="$PRIMARY" api python -m src.tools.key_rotation check \
          || { echo "Some tokens still need an older key — run reencrypt first. Nothing was changed." >&2; exit 1; }
        printf '%s' "$PRIMARY" | docker compose run --rm -T gcloud secrets versions add {{.SECRET}} --data-file=-
        # Versions list newest first: skip the one just added, disable the rest.
        for v in $(docker compose run --rm -T gcloud secrets versions list {{.SECRET}} --filter="state=ENABLED" --format="value(name)" | tr -d '\r' | tail -n +2); do
          docker compose run --rm -T gcloud secrets versions disable "$v" --secret={{.SECRET}}
        done
        echo "Done. Run task secrets:github-key:reload so the app loads the single key."

  secrets:github-key:check:
    desc: Check that the keys in the secret can read every stored GitHub/Jira token — read only, nothing is written
    cmds:
      - docker compose build api
      - |
        KEYS=$(docker compose run --rm -T gcloud secrets versions access latest --secret={{.KEY_SECRET}} | tr -d '\r\n')
        docker compose run --rm -e GITHUB_TOKEN_ENCRYPTION_KEY="$KEYS" api python -m src.tools.key_rotation check

  secrets:github-key:init:
    desc: One-time setup — generate a Fernet key and store it as the GitHub token encryption secret. Safe to re-run; skips if a version already exists (overwriting it would break already-encrypted tokens).
    cmds:
      - |
        if docker compose run --rm gcloud secrets versions list {{.KEY_SECRET}} --format="value(name)" 2>/dev/null | grep -q .; then
          echo "A key already exists for {{.KEY_SECRET}} — leaving it as is."
        else
          python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" | docker compose run --rm -T gcloud secrets versions add {{.KEY_SECRET}} --data-file=-
        fi
