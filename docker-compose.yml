services:
  gcloud:
    build:
      context: .
      dockerfile: Dockerfile.gcloud
    network_mode: host
    volumes:
      # Same identity as the host gcloud CLI — no separate login needed.
      - ~/.config/gcloud:/root/.config/gcloud
    entrypoint: ["gcloud"]

  terraform:
    image: hashicorp/terraform:1.15
    working_dir: /workspace
    volumes:
      - ./terraform:/workspace
      # Shares ADC so the Google provider authenticates the same way the
      # host's gcloud CLI does, without baking credentials into the image.
      - ~/.config/gcloud:/root/.config/gcloud:ro
    entrypoint: ["terraform"]

  uv:
    # uv runs in a container like gcloud/terraform above — nothing is
    # installed on the host (APPCE-96). The environment is built inside the
    # container (/tmp, gone with it), not in ./.venv: a venv created there
    # points at the container's Python and would be broken on the host.
    # A named volume would persist it, but Docker creates those root-owned,
    # which this non-root user can't write to.
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    # Runs as the invoking user so uv.lock etc. aren't written root-owned
    # into the repo (override with UV_UID/UV_GID if yours isn't 1000).
    user: "${UV_UID:-1000}:${UV_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/venv
      UV_LINK_MODE: copy
      UV_CACHE_DIR: /tmp/uv-cache
    entrypoint: ["uv"]

  api:
    build:
      context: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # WSL2 restarts (sleep, idle shutdown) stop every container; with this the
    # service comes back once Docker does. `docker compose stop/down` still
    # keeps it stopped.
    restart: unless-stopped
    ports:
      - "8010:8000"
    # No emulator env vars on purpose — this container hits real GCP,
    # like it will on Cloud Run.
    environment:
      # The real project comes from GOOGLE_CLOUD_PROJECT in .env. GCP_PROJECT_ID
      # is not read from there on purpose: in .env it names the emulator's
      # made-up project, not this one.
      GCP_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_GENAI_USE_ENTERPRISE: "1"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      # Not a secret — a Google OAuth client ID is meant to be public,
      # it's embedded in the frontend's JS bundle too (see APPCE-54).
      GOOGLE_OAUTH_CLIENT_ID: 430288501339-aiifao42l0fp6qirm2kiluh8fv4qfb3k.apps.googleusercontent.com
      # Who may sign in locally, from .env (see .env.example). Empty means
      # nobody can.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      # Compose reads this from the repo-root .env for variable substitution
      # (not via env_file — see the "no env_file" note above), so it stays
      # out of this file. See .env.example for how to fetch the real value.
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY}
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --project=anamnesis-local --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  subscriber:
    build:
      context: .
    command: ["python", "-m", "src.subscriber"]
    depends_on:
      - firestore-emulator
      - pubsub-emulator
    environment:
      # Container-to-container traffic uses the compose service names,
      # not localhost — unlike host-run scripts, which still reach the
      # emulators via localhost thanks to the ports mapping above.
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: anamnesis-local

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Live code reload: edit frontend/src on the host and see it without
      # rebuilding the image (same pattern as adk-web below).
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      # Anonymous volume so the container's own npm-installed
      # node_modules isn't shadowed by the host bind mounts above.
      - /app/node_modules

  adk-web:
    build:
      context: .
    command: ["adk", "web", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8001:8000"
    depends_on:
      - firestore-emulator
      - pubsub-emulator
    # Brings in GITHUB_TOKEN_ENCRYPTION_KEY (Jira/GitHub credentials are
    # per-user now, connected from Settings — see APPCE-79, APPCE-87).
    # Safe to combine with the environment overrides below: Compose always
    # lets `environment:` win over `env_file:` for the same key, so the
    # emulator hostnames here still take priority over .env's localhost
    # values — this container is meant to keep using the emulators, not
    # switch to real GCP.
    env_file: .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: anamnesis-local
    volumes:
      # Vertex AI (ADC) — agent/.env has the project/location settings
      # baked into the image already, but still needs real credentials.
      - ~/.config/gcloud:/root/.config/gcloud:ro
      # Live code reload: edit agent.py or src/ on the host and see it
      # without rebuilding the image.
      - ./agent:/app/agent
      - ./src:/app/src
